name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt pytest ruff
      - run: python -m pytest -q
      - run: python -m compileall -q backend tests
      - run: ruff check backend tests --select E4,E7,E9,F
      - name: deployment smoke check
        shell: bash
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8765 --no-access-log &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          python tests/smoke.py http://127.0.0.1:8765
